<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23000c0a'/%3E%3Cpath d='M6 7l5 5-5 5' fill='none' stroke='%2374e9b4' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M13 17h5' stroke='%2374e9b4' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulazione dell'agente · Argomento 1 · Coding agentico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  /* Tema della locandina, stessi colori delle slide. Contrasti misurati (WCAG) come in slide.html:
     text 17,6 / 15,2 / 13,6; muted 11,1 / 9,6 / 8,6; accent 13,3 / 11,4 / 10,3; accent-2 14,4 / 12,4 / 11,2;
     danger 8,8 / 7,5 / 6,8; info >= 9; border (bordi, minimo 3:1) 5,0 / 4,3 / 3,8 su bg / panel / panel-2. */
  :root {
    --bg: #000c0a; --panel: #06201a; --panel-2: #0a2a22;
    --text: #e6f5ec; --muted: #a9c9b8; --accent: #74e9b4; --accent-2: #ffd866;
    --danger: #ff8a8a; --info: #8cd0ff; --border: #2f8f68;
    --sans: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --cond: 'Barlow Condensed', 'Arial Narrow', 'Barlow', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --fs-xs: clamp(16px, 0.2vw + 14px, 17px);
    --fs-sm: clamp(17px, 0.6vw + 13px, 20px);
    --fs-body: clamp(18px, 0.6vw + 13px, 22px);
    --fs-h1: clamp(34px, 3vw + 16px, 56px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--fs-body); line-height: 1.5; }
  #root { min-height: 100vh; }
  h1, h2, h3 { font-family: var(--cond); text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
  code, .mono { font-family: var(--mono); font-size: .88em; overflow-wrap: anywhere; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .box.warn { border-left: 5px solid var(--accent-2); border-radius: 0 10px 10px 0; }
  .box.ok { border-left: 5px solid var(--accent); border-radius: 0 10px 10px 0; }
  .sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .sim-grid { grid-template-columns: 1fr; } }
  .log-item { display: flex; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .log-item b { display: block; color: var(--text); font-size: var(--fs-sm); }
  .log-item span.d { color: var(--muted); font-size: var(--fs-xs); }
  .badge { font-family: var(--mono); font-size: var(--fs-xs); color: var(--info); flex: none; }
  .btn { display: block; width: 100%; text-align: left; padding: 10px 14px; min-height: 44px; background: var(--panel-2); color: var(--text);
         border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font: inherit; font-size: var(--fs-sm); }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.go { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.good { border-color: var(--accent); background: var(--panel); }
  .btn.bad { border-color: var(--danger); background: var(--panel); }
  .btn.ghost { background: transparent; color: var(--muted); width: auto; display: inline-block; font-size: var(--fs-xs); }
  .btn:disabled { cursor: default; }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs-xs); }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--muted); }
  details > summary { cursor: pointer; font-weight: 600; font-size: var(--fs-sm); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* Sequenza didattica sul compito della prima esercitazione (la palestra: prenotazione dei laboratori, dati inventati).
   Non è l'output di un modello vero: un agente reale può cambiare ordine, parole e numero di passi. */

const TASK = "Leggi docs/idea-dashboard.md e aggiungi a elenco l'opzione --lab, come fa la dashboard. Prima dammi solo un piano. Non toccare dati/dati.json.";

const STEPS = [
  { action: "Fa un piano", icon: "PIANO",
    detail: "Prima di toccare qualcosa elenca: leggerà le istruzioni, il piano della dashboard, cli.js, src/logica.js e i test; aggiungerà un filtro per laboratorio in logica.js e l'opzione --lab in cli.js; scriverà un test in test/cli.test.js; non toccherà dati/dati.json; verificherà con node --test e con elenco --lab LAB-INF1." },
  { action: "Aspetta il tuo sì", icon: "STOP",
    detail: "Si ferma. Tu rispondi: «Il piano va bene, con una correzione: lancia tutti i test alla fine e dimmi i numeri.» L'agente aggiorna il piano e procede.",
    options: ["Esegue subito, perché il compito era chiaro", "Aspetta che tu approvi o corregga il piano", "Passa da solo a una modalità che non chiede più permessi"], correct: 1 },
  { action: "Legge le istruzioni, il piano e il codice", icon: "READ",
    detail: "Ha già in contesto CLAUDE.md, che dice che i dati stanno in dati/prenotazioni.json. Apre il piano della dashboard, cli.js, src/logica.js e src/archivio.js: nel codice il file è dati/dati.json, e il file delle istruzioni è sbagliato. Lo segnala invece di cercare un file che non c'è.",
    options: ["Si fida di CLAUDE.md e cerca dati/prenotazioni.json", "Legge il codice e nota che il file dei dati è un altro", "Ti chiede di incollare il codice in chat"], correct: 1 },
  { action: "Lancia i test prima di modificare", icon: "BASH",
    detail: "Chiede il permesso di eseguire node --test. Tu leggi il comando (un comando solo, nella cartella del progetto) e rispondi sì una volta. Esito: 35 test, 35 passano, 0 falliscono. Ora c'è un punto di partenza da confrontare.",
    options: ["Salta i test: ci sono già e dovrebbero passare", "Chiede il permesso e lancia node --test per avere un punto di partenza", "Scrive la modifica e lancia i test solo se qualcosa si rompe"], correct: 1 },
  { action: "Chiede il permesso per modificare i file", icon: "PERMESSO",
    detail: "«Posso modificare src/logica.js (una riga nel filtro di elenco) e cli.js (l'opzione --lab e il passaggio del valore)? Non tocco dati/dati.json.» Tu rispondi sì. Modificare un file chiede sempre il permesso in Manual, e la copia usa e getta rende l'errore poco costoso; ma non si approva senza leggere.",
    options: ["Modifica subito: tanto la cartella è una copia", "Riscrive tutto src/logica.js per fare ordine", "Chiede il permesso e dice quali file tocca"], correct: 2 },
  { action: "Modifica logica.js e cli.js", icon: "EDIT",
    detail: "In src/logica.js aggiunge al filtro di elenco la riga per il laboratorio; in cli.js dichiara l'opzione lab tra quelle di elenco e la passa alla funzione. Due modifiche piccole, nei file annunciati dal piano. Non tocca server.js né la pagina web.",
    options: ["Modifica solo i due file annunciati", "Cambia anche server.js e la pagina web, già che c'è", "Cambia i nomi delle funzioni per renderle più chiare"], correct: 0 },
  { action: "Si ferma su una scelta che il piano non faceva", icon: "STOP",
    detail: "Chiede: «Con --lab LAB-XYZ, un laboratorio che non esiste, vuoi un elenco vuoto oppure un errore?» Il piano non lo diceva e il piano della dashboard nemmeno. L'agente non sceglie. Tu rispondi: «Elenco vuoto, come per le altre ricerche senza risultati.»",
    options: ["Aggiunge un errore con codice di uscita 1, perché sembra più corretto", "Ti chiede cosa vuoi in quel caso", "Lascia il comportamento a caso, senza accorgersene"], correct: 1 },
  { action: "Aggiunge un test e lo lancia", icon: "BASH",
    detail: "Scrive in test/cli.test.js un test che chiama elenco --lab LAB-INF1 e controlla che le righe siano quattro e che contengano tutte LAB-INF1. Chiede il permesso per modificare il file e per lanciare node --test. Esito: 36 test, 36 passano, 0 falliscono.",
    options: ["Non aggiunge nessun test: la modifica è troppo piccola", "Cambia un test già esistente perché passi con la nuova opzione", "Aggiunge un test e lancia node --test, dopo il tuo permesso"], correct: 2 },
  { action: "Controlla il risultato con un comando vero", icon: "BASH",
    detail: "Esegue node cli.js elenco --lab LAB-INF1 e mostra le quattro prenotazioni che si aspetta: P-0001, P-0003, P-0004, P-0008. Poi ne prova un'altra, LAB-RETI, con la sola P-0005. Senza Git non c'è un diff vero: mostra anche l'elenco dei file toccati (logica.js, cli.js, cli.test.js) e conferma che dati/dati.json è rimasto com'era.",
    options: ["Dice «funziona» perché il codice gli sembra giusto", "Controlla solo che cli.js sia stato salvato", "Esegue il comando con due laboratori diversi e mostra l'esito"], correct: 2 },
  { action: "Dichiara i limiti", icon: "LIMITI",
    detail: "Scrive cosa non ha fatto o verificato: la pagina web e il server non filtrano per laboratorio (non richiesto); il README non cita la nuova opzione; CLAUDE.md nomina un file dei dati sbagliato e non l'ha corretto perché non gli è stato chiesto; non ha provato il filtro combinato con --data e --docente.",
    options: ["Dice che è tutto verificato", "Elenca cosa non ha fatto o non ha potuto verificare", "Corregge da solo il README e CLAUDE.md senza dirlo"], correct: 1 },
  { action: "Consegna", icon: "FINE",
    detail: "Presenta il riepilogo: tre file toccati, test da 35 a 36 tutti verdi, dati intatti. Lascia a te le decisioni che restano: se correggere CLAUDE.md, se estendere il filtro alla pagina web, le due domande rimaste aperte nel piano della dashboard.",
    options: ["Consegna il riepilogo e lascia a te le decisioni che restano", "Corregge CLAUDE.md e la pagina web, per completezza", "Scrive ai colleghi che la nuova opzione è pronta"], correct: 0 },
];

const END = "Consegnato. L'agente ha pianificato prima, aspettato il tuo sì, letto il codice invece di fidarsi del file di istruzioni, chiesto il permesso prima di modificare, lasciato a te la scelta che il piano non faceva, controllato con un comando vero e dichiarato i limiti. Ogni passo era una traccia che potevi leggere: è il tuo modo di controllarlo.";

const LABS = [
  ['Codice', 'Laboratorio', 'Posti'],
  ['LAB-INF1', 'Laboratorio Informatica 1', '24'],
  ['LAB-INF2', 'Laboratorio Informatica 2', '20'],
  ['LAB-RETI', 'Laboratorio Reti', '18'],
  ['LAB-ELET', 'Laboratorio Elettronica', '16'],
];
const PREN = [
  ['Prenotazione', 'Laboratorio', 'Data', 'Orario'],
  ['P-0001', 'LAB-INF1', '2026-10-12', '08:00-10:00'],
  ['P-0003', 'LAB-INF1', '2026-11-12', '09:00-11:00'],
  ['P-0004', 'LAB-INF1', '2026-11-12', '11:00-13:00'],
  ['P-0008', 'LAB-INF1', '2026-12-03', '14:00-17:00'],
];

function Tabella({ righe }) {
  return (
    <div className="scroll">
      <table>
        <thead><tr>{righe[0].map((h, i) => <th key={i} scope="col">{h}</th>)}</tr></thead>
        <tbody>{righe.slice(1).map((r, i) => <tr key={i}>{r.map((c, k) => <td key={k}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function Agente() {
  const [step, setStep] = useState(0);
  const [guessMode, setGuessMode] = useState(false);
  const [guess, setGuess] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [giuste, setGiuste] = useState(0);
  const [tot, setTot] = useState(0);
  const [log, setLog] = useState([STEPS[0]]);
  const atEnd = step >= STEPS.length - 1;
  const next = !atEnd ? STEPS[step + 1] : null;

  const pick = (i) => {
    if (revealed) return;
    setGuess(i); setRevealed(true); setTot(t => t + 1);
    if (i === next.correct) setGiuste(c => c + 1);
  };
  const advance = () => {
    const n = step + 1;
    setStep(n); setLog(l => [...l, STEPS[n]]);
    setGuessMode(false); setGuess(null); setRevealed(false);
  };
  const restart = () => { setStep(0); setLog([STEPS[0]]); setGuessMode(false); setGuess(null); setRevealed(false); setGiuste(0); setTot(0); };

  return (
    <div className="box" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 8 }}>
        <h2 style={{ color: 'var(--accent)', fontSize: 28 }}>L'agente</h2>
        <div className="mono muted" aria-live="polite">Previsioni giuste: <strong style={{ color: 'var(--accent-2)' }}>{giuste}/{tot}</strong></div>
      </div>
      <div style={{ background: 'var(--panel-2)', borderRadius: 8, padding: '8px 12px', fontSize: 'var(--fs-sm)' }}>
        <strong>Compito:</strong> {TASK}
      </div>
      <div className="mono muted" style={{ textTransform: 'uppercase', letterSpacing: 1, fontSize: 'var(--fs-xs)' }}>Traccia delle azioni</div>
      <div role="log" aria-live="polite" style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 420, overflowY: 'auto' }}>
        {log.map((s, i) => (
          <div className="log-item" key={i}>
            <span className="badge">{s.icon}</span>
            <div><b>{s.action}</b><span className="d">{s.detail}</span></div>
          </div>
        ))}
      </div>

      {!atEnd && !guessMode && (
        <button className="btn go" onClick={() => { setGuess(null); setRevealed(false); setGuessMode(true); }}>Indovina la prossima mossa &rarr;</button>
      )}
      {!atEnd && guessMode && (
        <div role="group" aria-label="Opzioni per la prossima mossa" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div className="muted">Cosa farà adesso l'agente?</div>
          {next.options.map((o, i) => {
            const cls = revealed ? (i === next.correct ? 'good' : (i === guess ? 'bad' : '')) : '';
            const mark = revealed ? (i === next.correct ? '✓ ' : (i === guess ? '✗ ' : '')) : '';
            return <button key={i} className={'btn ' + cls} disabled={revealed} onClick={() => pick(i)}>{mark}{o}</button>;
          })}
          {revealed && <button className="btn go" onClick={advance}>Avanti &rarr;</button>}
        </div>
      )}
      {atEnd && <div className="box ok" style={{ fontSize: 'var(--fs-sm)' }}>{END}</div>}
      <button className="btn ghost" onClick={restart}>&#8634; Ricomincia la simulazione</button>
    </div>
  );
}

function App() {
  const calcZoom = () => (window.innerWidth <= 900 ? 1 : Math.min(2.4, Math.max(1, Math.min(window.innerWidth / 1366, window.innerHeight / 768))));
  const [zoom, setZoom] = useState(calcZoom);
  useEffect(() => {
    const f = () => setZoom(calcZoom());
    window.addEventListener('resize', f);
    return () => window.removeEventListener('resize', f);
  }, []);
  return (
    <div className="wrap" style={{ zoom }}>
      <a href="slide.html">&larr; Torna alle slide</a>
      <h1 style={{ color: 'var(--accent)', fontSize: 'var(--fs-h1)', margin: '16px 0 14px' }}>Argomento 1 — Dal chatbot all'agente · Simulazione</h1>

      <div className="box warn" style={{ marginBottom: 16 }}>
        <p style={{ marginBottom: 8 }}><strong>Il compito.</strong> Una piccola app per prenotare i laboratori di una scuola inventata, con una riga di comando, i test e un file con i dati. Un file di piano, <code>docs/idea-dashboard.md</code>, descrive una dashboard che filtra per laboratorio; l'app non lo fa. L'agente deve aggiungere l'opzione <code>--lab</code> a <code>elenco</code>.</p>
        <p><strong>Come si gioca.</strong> Prima di ogni mossa premi «Indovina la prossima mossa», scegli una delle tre opzioni e guarda quale è giusta. Poi premi «Avanti» e leggi cosa è successo nella traccia. Le mosse da indovinare sono dieci.</p>
      </div>

      <details style={{ marginBottom: 16 }} className="box">
        <summary>I dati della palestra (inventati)</summary>
        <div style={{ marginTop: 10, display: 'grid', gap: 12 }}>
          <Tabella righe={LABS} />
          <Tabella righe={PREN} />
          <p className="muted" style={{ fontSize: 'var(--fs-xs)' }}>Le prenotazioni di LAB-INF1 sono le quattro in tabella: sono quelle che un filtro per laboratorio deve far vedere. In tutto le prenotazioni attive sono sette.</p>
        </div>
      </details>

      <div className="sim-grid">
        <div className="box">
          <h2 style={{ color: 'var(--info)', fontSize: 28, marginBottom: 8 }}>Cosa guardare</h2>
          <ul style={{ paddingLeft: 20, display: 'grid', gap: 8, fontSize: 'var(--fs-sm)' }}>
            <li>Dove si ferma e aspetta una persona.</li>
            <li>Quali azioni chiedono un permesso e quali no.</li>
            <li>Che cosa prova con un comando vero e con i test.</li>
            <li>Cosa lascia a te invece di decidere.</li>
          </ul>
          <p className="muted" style={{ marginTop: 12, fontSize: 'var(--fs-xs)' }}>Sequenza didattica sul compito della prima esercitazione (la palestra): non è l'output di un modello vero. Un agente reale può cambiare ordine, parole e numero di passi; resta valido ciò che controlli nella traccia.</p>
        </div>
        <Agente />
      </div>

      <p className="muted" style={{ marginTop: 24, fontSize: 'var(--fs-sm)' }}>Dati inventati: nessuna scuola, persona o prenotazione reale.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
