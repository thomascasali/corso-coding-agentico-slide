<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argomento 12 · Helpdesk email in autopilota · Coding agentico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
/* @tema-inizio (blocco comune a tutti gli argomenti: si modifica SOLO in modello/slide.html e si ricopia, vedi modello/LEGGIMI.md) */
  /* Tema della locandina. Contrasti misurati (WCAG) su --bg / --panel / --panel-2:
     text 17,6 / 15,2 / 13,6; muted 11,1 / 9,6 / 8,6; accent 13,3 / 11,4 / 10,3;
     accent-2 14,4 / 12,4 / 11,2; danger 8,8 / 7,5 / 6,8; info >= 9;
     border (bordi, minimo 3:1) 5,0 / 4,3 / 3,8. */
  :root {
    --bg: #000c0a;
    --panel: #06201a;
    --panel-2: #0a2a22;
    --text: #e6f5ec;
    --muted: #a9c9b8;
    --accent: #74e9b4;
    --accent-2: #ffd866;   /* avvisi */
    --danger: #ff8a8a;
    --info: #8cd0ff;
    --border: #2f8f68;
    --sans: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --cond: 'Barlow Condensed', 'Arial Narrow', 'Barlow', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --fs-xs: clamp(16px, 0.2vw + 14px, 17px);
    --fs-sm: clamp(17px, 0.6vw + 13px, 20px);
    --fs-body: clamp(18px, 0.6vw + 13px, 22px);
    --fs-lead: clamp(20px, 1vw + 14px, 26px);
    --fs-h2: clamp(28px, 1.6vw + 14px, 38px);
    --fs-h1: clamp(38px, 4.4vw + 16px, 72px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.45; }
  #root { min-height: 100vh; }
  h1, h2, h3 { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; color: var(--accent); overflow-wrap: anywhere; }
  h1 { font-size: var(--fs-h1); }
  h2 { font-size: var(--fs-h2); margin-bottom: 10px; }
  p, li { font-size: var(--fs-body); color: var(--muted); }
  p { margin-bottom: 10px; }
  ul, ol { padding-left: 26px; }
  li { margin-bottom: 6px; }
  strong { color: var(--text); font-weight: 600; }
  code, pre { font-family: var(--mono); }
  code { color: var(--accent); font-size: 0.88em; overflow-wrap: anywhere; }
  .nw { white-space: nowrap; }
  .pad { padding: 12px 26px; }
  .center { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(62vh / var(--zoom, 1)); padding: 20px 30px; }
  .center p { max-width: 62ch; }
  .tag { display: inline-block; font-family: var(--cond); font-weight: 600; font-size: var(--fs-sm); color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; border: 1px solid var(--border); border-radius: 20px; padding: 2px 14px; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: var(--fs-sm); }
  .legend { color: var(--muted); font-size: var(--fs-sm); }
  /* griglie */
  .grid { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); }
  .cols { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; align-items: start; }
  .cols > * { min-width: 0; }
  .twocol { column-count: 2; column-gap: 28px; }
  .twocol li { break-inside: avoid; font-size: var(--fs-sm); }
  /* card e statistiche */
  .card { background: var(--panel); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 16px; }
  .card.w { border-left-color: var(--accent-2); } .card.i { border-left-color: var(--text); } .card.d { border-left-color: var(--danger); }
  .card h4 { font-family: var(--cond); font-weight: 600; font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 4px; }
  .card.w h4 { color: var(--accent-2); } .card.i h4 { color: var(--text); } .card.d h4 { color: var(--danger); }
  .card p, .card li { font-size: var(--fs-sm); margin-bottom: 4px; }
  .card ul, .card ol { padding-left: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; text-align: center; }
  .stat b { display: block; font-family: var(--cond); font-weight: 700; font-size: var(--fs-h2); color: var(--accent); line-height: 1.1; }
  .stat span { font-size: var(--fs-sm); color: var(--muted); line-height: 1.25; display: block; }
  /* box: warn (predefinito), info, danger, tip. Il tipo si legge anche dal simbolo, non solo dal colore. */
  .box { background: var(--panel-2); border: 1px solid var(--border); border-left: 5px solid var(--accent-2); border-radius: 0 8px 8px 0; padding: 8px 16px; margin: 12px 0 0; }
  .box strong.t { font-family: var(--cond); color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.1em; font-size: var(--fs-sm); display: block; margin-bottom: 2px; }
  .box strong.t::before { content: '\25B2\00a0'; }
  .box.info { border-left-color: var(--info); } .box.info strong.t { color: var(--info); } .box.info strong.t::before { content: '\2139\00a0'; }
  .box.danger { border-left-color: var(--danger); } .box.danger strong.t { color: var(--danger); } .box.danger strong.t::before { content: '\2715\00a0'; }
  .box.tip { border-left-color: var(--accent); } .box.tip strong.t { color: var(--accent); } .box.tip strong.t::before { content: '\2605\00a0'; }
  .box p { font-size: var(--fs-sm); margin-bottom: 0; }
  .box p + p { margin-top: 6px; }
  /* codice */
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; overflow-x: auto; font-size: var(--fs-xs); color: var(--text); line-height: 1.5; margin: 10px 0; }
  /* tabelle: a schede sotto i 900 px (componente DT) */
  table { width: 100%; border-collapse: collapse; margin: 6px 0; }
  th, td { text-align: left; vertical-align: top; padding: 6px 10px; border: 1px solid var(--border); font-size: var(--fs-sm); color: var(--muted); line-height: 1.3; }
  th { font-family: var(--cond); color: var(--accent); background: var(--panel-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
  td:first-child { color: var(--text); font-weight: 600; }
  /* elenchi speciali */
  .steps { list-style: none; padding: 0; }
  .steps li { background: var(--panel); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 0 8px 8px 0; padding: 6px 12px; margin-bottom: 8px; font-size: var(--fs-sm); color: var(--muted); }
  .steps li.w { border-left-color: var(--accent-2); } .steps li.i { border-left-color: var(--text); }
  .steps b { color: var(--text); }
  .timeline { list-style: none; padding: 0; border-left: 2px solid var(--border); margin-left: 8px; }
  .timeline li { position: relative; padding: 0 0 8px 22px; margin: 0; font-size: var(--fs-sm); line-height: 1.35; }
  .timeline li::before { content: ''; position: absolute; left: -7px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .timeline time { font-family: var(--mono); font-size: 0.85em; color: var(--accent); font-weight: 700; margin-right: 10px; }
  .terms { display: grid; gap: 8px 22px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .terms div { border-left: 3px solid var(--border); padding-left: 12px; }
  .terms dt { font-family: var(--cond); font-weight: 600; font-size: var(--fs-body); color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .terms dd { font-size: var(--fs-sm); color: var(--muted); line-height: 1.3; }
  /* diagramma a riquadri HTML (componente Flow): 4 per riga, impilati su schermi stretti */
  .rowlabel { font-family: var(--cond); font-weight: 600; font-size: var(--fs-sm); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 6px 0; }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 34px; }
  .node { position: relative; background: var(--panel); border: 2px solid var(--accent); border-radius: 8px; padding: 6px 12px; }
  .node b { display: block; font-family: var(--cond); font-weight: 700; font-size: var(--fs-body); color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
  .node span { display: block; font-size: var(--fs-sm); color: var(--text); line-height: 1.25; }
  .node.w { border-color: var(--accent-2); } .node.w b { color: var(--accent-2); }
  .node.i { border-color: var(--text); } .node.i b { color: var(--text); }
  .node:not(:nth-child(4n))::after { content: '\2192'; position: absolute; right: -28px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 26px; line-height: 1; }
  .node:last-child::after { content: none !important; }
  .join { text-align: center; color: var(--accent); font-size: var(--fs-sm); margin: 6px 0 0; }
  .svgwrap svg { width: 100%; height: auto; display: block; }
  .svt { font-family: var(--sans); }
  .only-mob { display: none; }
  /* attivita' al PC (ActivityBadge) */
  .activity { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: var(--fs-sm); color: var(--text); background: var(--panel); border: 2px solid var(--accent); border-radius: 8px; padding: 8px 14px; margin-top: 10px; text-decoration: none; }
  .activity:hover { background: var(--panel-2); }
  .activity .k { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
  .activity .l { text-decoration: underline; text-underline-offset: 3px; }
  .activity .d { font-family: var(--mono); font-size: 0.85em; color: var(--muted); }
  /* quiz a scelta multipla */
  .quiz .q { font-size: var(--fs-lead); color: var(--text); margin-bottom: 10px; }
  .quiz .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; font: inherit; font-size: var(--fs-body); color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt .lt { font-family: var(--cond); font-weight: 700; color: var(--accent); min-width: 1.2em; }
  .opt.ok { border: 2px solid var(--accent); background: var(--panel-2); }
  .opt.ko { border: 2px dashed var(--danger); }
  .quiz .fb { min-height: 3.6em; margin-top: 10px; font-size: var(--fs-sm); color: var(--muted); }
  .quiz .fb strong { color: var(--accent); }
  .quiz .fb.ko strong { color: var(--danger); }
  /* effetto unico: cursore lampeggiante (solo slide titolo) */
  .cursor { display: inline-block; width: 0.5em; height: 0.85em; background: var(--accent); vertical-align: -0.05em; margin-left: 6px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* link, focus, barre, note */
  .text-link { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .text-link:hover { color: var(--text); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .bar { position: fixed; left: 0; right: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px; z-index: 100; }
  .top-bar { top: 0; height: 56px; border-bottom: 1px solid var(--border); }
  .bottom-bar { bottom: 0; min-height: 60px; border-top: 1px solid var(--border); }
  .blocklabel { color: var(--accent); font-family: var(--cond); font-weight: 600; font-size: var(--fs-sm); letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .counter { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  .notes-panel { position: fixed; left: 0; right: 0; bottom: 60px; max-height: 42vh; overflow-y: auto; background: var(--bg); border-top: 2px solid var(--accent); padding: 14px 26px; z-index: 90; font-size: var(--fs-sm); color: var(--muted); }
  .notes-panel strong { color: var(--accent); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; padding: 0; }
  .icon-btn:hover:not(:disabled) { border-color: var(--accent); }
  .icon-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.6; }
  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .group { display: flex; align-items: center; gap: 8px; }
  @media (max-width: 900px) {
    .pad { padding: 12px 14px; }
    .bar { padding: 0 12px; }
    .cols, .g2 { grid-template-columns: 1fr; } .g3 { grid-template-columns: 1fr 1fr; }
    .twocol { column-count: 1; }
    .only-desk { display: none; } .only-mob { display: block; }
    .terms { grid-template-columns: 1fr; }
    .blocklabel { font-size: 16px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.1; }
    /* tabelle a schede (classe dt, attributo data-l = etichetta di colonna) */
    .dt thead { display: none; }
    .dt, .dt tbody, .dt tr, .dt td { display: block; width: 100%; }
    .dt tr { border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--panel); margin-bottom: 10px; padding: 6px 10px; }
    .dt td { border: 0; padding: 3px 0; }
    .dt td:first-child { color: var(--accent); }
    .dt td::before { content: attr(data-l); display: block; font-family: var(--cond); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .dt td:first-child::before { display: none; }
    pre { font-size: 14px; }
  }
  @media (max-width: 600px) {
    .flow { grid-template-columns: 1fr; gap: 28px; }
    .node:not(:nth-child(4n))::after { content: '\2193'; right: auto; left: 50%; top: auto; bottom: -27px; transform: translateX(-50%); }
    .node:nth-child(4n)::after { content: none; }
    .node:nth-child(4):not(:last-child)::after { content: none; }
    .g3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) { .top-bar .hide-s { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* @tema-fine */
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* @componenti-inizio (blocco comune: si modifica solo in modello/slide.html) */

const Tag = ({ children }) => <div className="tag">{children}</div>;

/* type: 'warn' (predefinito), 'info', 'danger', 'tip' */
const Box = ({ type = 'warn', title, children }) => (
  <div className={'box ' + type}><strong className="t">{title}</strong><p>{children}</p></div>
);

const Stat = ({ big, label }) => <div className="stat"><b>{big}</b><span>{label}</span></div>;

/* kind: '' (accento), 'w' (avviso), 'i' (neutra), 'd' (pericolo) */
const Card = ({ title, kind = '', children }) => (
  <div className={'card ' + kind}><h4>{title}</h4>{children}</div>
);

/* Tabella che sotto i 900 px diventa un elenco di schede (data-l = etichetta di colonna) */
const DT = ({ cols, rows }) => (
  <table className="dt">
    <thead><tr>{cols.map(c => <th key={c}>{c}</th>)}</tr></thead>
    <tbody>{rows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} data-l={cols[j]}>{c}</td>)}</tr>)}</tbody>
  </table>
);

/* Diagramma a riquadri HTML: nodes = [[titolo, sottotitolo, tipo], ...], tipo '' | 'w' | 'i'.
   Fino a 4 riquadri per riga; su schermi stretti si impilano con una freccia in basso. */
const Flow = ({ label, nodes }) => (
  <div>
    {label && <div className="rowlabel">{label}</div>}
    <div className="flow">
      {nodes.map(([t, s, k], i) => <div key={i} className={'node ' + (k || '')}><b>{t}</b><span>{s}</span></div>)}
    </div>
  </div>
);

/* Attivita' al PC: apre la scheda in materiali/argomento-N/<file> (cartella generata da scripts/genera-materiali.py).
   durata: stima indicativa dell'esercizio, mai un orario. */
const ActivityBadge = ({ n, file, label, durata }) => (
  <a className="activity" href={'../materiali/argomento-' + n + '/' + file} target="_blank" rel="noopener" onClick={e => e.stopPropagation()}>
    <span className="k">Attività al PC</span>
    <span className="l">{label}</span>
    {durata && <span className="d">{durata}</span>}
    <span aria-hidden="true">&#8599;</span>
  </a>
);

/* Quiz a scelta multipla: opzioni = [{ t: testo, ok: true|false, perche: spiegazione se scelta }].
   Le risposte attese delle esercitazioni restano riservate al docente: qui solo domande di comprensione. */
function Quiz({ domanda, opzioni }) {
  const [sel, setSel] = useState(null);
  const done = sel !== null;
  const ok = done && opzioni[sel].ok;
  return (
    <div className="quiz">
      <p className="q">{domanda}</p>
      <div className="opts" role="group" aria-label="Risposte possibili">
        {opzioni.map((o, i) => (
          <button key={i} className={'opt' + (done && o.ok ? ' ok' : '') + (sel === i && !o.ok ? ' ko' : '')} onClick={() => setSel(i)} aria-pressed={sel === i}>
            <span className="lt">{'ABCD'[i]}</span><span>{o.t}</span>
          </button>
        ))}
      </div>
      <div className={'fb' + (done && !ok ? ' ko' : '')} aria-live="polite">
        {done && <><strong>{ok ? 'Corretto. ' : 'Non proprio. '}</strong>{opzioni[sel].perche}</>}
      </div>
    </div>
  );
}

/* Slide titolo. prima = "Prima di questo argomento conviene aver visto" */
const Apertura = ({ n, titolo, sottotitolo, caso, prima }) => (
  <div className="center">
    <p className="muted" style={{ letterSpacing: 3, textTransform: 'uppercase' }}>Coding agentico · Argomento {n}</p>
    <h1 style={{ margin: '12px 0 14px' }}><span aria-hidden="true">&gt; </span>{titolo}<span className="cursor" aria-hidden="true"></span></h1>
    <p style={{ fontSize: 'var(--fs-lead)', color: 'var(--text)' }}>{sottotitolo}</p>
    {caso && <p className="muted" style={{ marginTop: 14 }}>{caso}</p>}
    {prima && <p className="muted">Prima di questo argomento conviene aver visto: {prima}</p>}
  </div>
);

/* Ultima slide. punti = elenco da portare a casa, dopo = "Dopo questo argomento" */
const Chiusura = ({ punti, dopo }) => (
  <div className="pad">
    <Tag>Chiusura</Tag>
    <h2>Cosa portare a casa</h2>
    <ul>{punti.map((p, i) => <li key={i}>{p}</li>)}</ul>
    {dopo && <Box type="info" title="Dopo questo argomento">{dopo}</Box>}
    <p className="muted" style={{ marginTop: 10 }}><a className="text-link" href="../index.html" onClick={e => e.stopPropagation()}>Torna all'indice del corso</a></p>
  </div>
);

/* @componenti-fine */

/* Diagramma della pipeline: SVG su schermo largo, elenco su telefono */
const STEPS = [
  ['1 Casella', 'richieste di assistenza', 'w'],
  ['2 Etichetta', 'filtro lato Gmail: solo le richieste', 'i'],
  ['3 Attività', 'programmata: un giro ogni 3 ore', ''],
  ['4 Diagnosi', 'SOLA LETTURA sui dati reali', ''],
  ['5 Correzione', 'solo con guardie: prova a secco, poi apply (scrive davvero)', ''],
  ['6 Bozza', 'in Gmail, mai un invio', ''],
  ['7 Persona', 'rilegge, sceglie il mittente, INVIA', 'w'],
  ['8 Report', 'riepilogo su disco e notifica con numeri', 'i'],
];
function Pipeline() {
  const col = { w: 'var(--accent-2)', i: 'var(--muted)', '': 'var(--accent)' };
  const box = (x, y, w, h, title, sub, k) => (
    <g>
      <rect x={x} y={y} width={w} height={h} rx="8" style={{ fill: 'var(--panel)', stroke: col[k], strokeWidth: 2 }} />
      <text className="svt" x={x + w / 2} y={y + 30} textAnchor="middle" fontSize="22" fontWeight="600" style={{ fill: col[k] }}>{title}</text>
      {sub.map((s, i) => <text className="svt" key={i} x={x + w / 2} y={y + 58 + i * 24} textAnchor="middle" fontSize="18" style={{ fill: 'var(--text)' }}>{s}</text>)}
    </g>
  );
  const arrow = (x1, y1, x2, y2) => <line x1={x1} y1={y1} x2={x2} y2={y2} style={{ stroke: 'var(--muted)', strokeWidth: 2 }} markerEnd="url(#hd)" />;
  return (
    <div>
      <div className="svgwrap only-desk">
        <svg viewBox="0 0 1000 312" role="img" aria-label="Pipeline dell'helpdesk: casella, etichetta, attività programmata, diagnosi in sola lettura; poi correzione con guardie, bozza, persona che invia, report">

const VALIDAZIONE = String.raw`const FORMATO = {
  id:     /^[0-9a-f]{24}$/,
  cerca:  /^[A-Za-z0-9 _@.-]{3,80}$/,
  numero: /^\d{1,3}$/,
};
function valida(tipo, valore) {
  if (!FORMATO[tipo].test(valore)) {
    console.error('Valore non valido: ' + tipo);
    process.exit(2);   // errore, nessuna "ripulitura"
  }
  return valore;
}`;

const IconNotes = () => <Svg><path d="M4 4h16v12H8l-4 4z" /><line x1="8" y1="9" x2="16" y2="9" /><line x1="8" y1="12.5" x2="13" y2="12.5" /></Svg>;

function App() {
  const hashIndex = () => { const n = parseInt((location.hash || '').replace('#', ''), 10); return n >= 1 && n <= slides.length ? n - 1 : 0; };
  const [current, setCurrent] = useState(hashIndex);
  const [notesOn, setNotesOn] = useState(false);
  const calcZoom = () => (window.innerWidth <= 900 ? 1 : Math.min(2.4, Math.max(1, Math.min(window.innerWidth / 1366, window.innerHeight / 768))));
  const [zoom, setZoom] = useState(calcZoom);
  const [isFs, setIsFs] = useState(false);
  const total = slides.length;
  const slide = slides[current];
  const fsOk = typeof document !== 'undefined' && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

  const next = () => setCurrent(c => Math.min(c + 1, total - 1));
  const prev = () => setCurrent(c => Math.max(c - 1, 0));

  const toggleFs = () => {
    if (!fsOk) return;
    try {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) { const el = document.documentElement; const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) { const p = r.call(el); if (p && p.catch) p.catch(() => {}); } }
      else { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) { const p = x.call(document); if (p && p.catch) p.catch(() => {}); } }
    } catch (err) { /* alcuni browser non supportano l'API */ }
  };

  useEffect(() => { document.title = slide.block; try { history.replaceState(null, '', '#' + (current + 1)); } catch (e) {} }, [current]);
  useEffect(() => {
    const onResize = () => setZoom(calcZoom());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  useEffect(() => {
    const h = e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return; /* il pulsante focalizzato fa il suo lavoro (quiz, navigazione) */
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'n' || e.key === 'N') setNotesOn(v => !v);
      if (e.key === 'f' || e.key === 'F') toggleFs();
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  useEffect(() => {
    const f = () => setIsFs(!!(document.fullscreenElement || document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', f);
    document.addEventListener('webkitfullscreenchange', f);
    return () => { document.removeEventListener('fullscreenchange', f); document.removeEventListener('webkitfullscreenchange', f); };
  }, []);

  return (
    <div style={{ minHeight: '100vh', position: 'relative' }}>
      <div className="bar top-bar">
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, minWidth: 0, flex: 1 }}>
          <a href="../index.html" className="text-link" style={{ textDecoration: 'none', fontSize: 'var(--fs-sm)', whiteSpace: 'nowrap' }}>&larr; Indice</a>
          <span style={{ color: 'var(--border)' }} aria-hidden="true">|</span>
          <span title={slide.block} className="blocklabel">{slide.block}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginLeft: 10 }}>
          <span className="counter">{current + 1} / {total}</span>
          <div className="hide-s" role="progressbar" aria-valuemin="1" aria-valuemax={total} aria-valuenow={current + 1} aria-label="Avanzamento" style={{ width: 100, height: 7, background: 'var(--panel-2)', border: '1px solid var(--border)', borderRadius: 4, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: ((current + 1) / total * 100) + '%', background: 'var(--accent)' }} />
          </div>
        </div>
      </div>

      <main style={{ paddingTop: 56, paddingBottom: notesOn ? 'calc(60px + 42vh)' : 68, minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <div key={current} className="slide-content" style={{ width: '100%', maxWidth: 1280, margin: 'auto', padding: '0 24px', zoom, '--zoom': zoom }}>
          {slide.content()}
        </div>
      </main>

      {notesOn && (
        <div className="notes-panel" role="region" aria-label="Note per chi parla">
          <strong>Note per chi parla</strong> &mdash; {slide.block}
          <p style={{ marginTop: 8, maxWidth: 'none', fontSize: 'var(--fs-sm)' }}>{slide.notes}</p>
        </div>
      )}

      <div className="bar bottom-bar">
        <div className="group">
          <button onClick={prev} disabled={current === 0} className="icon-btn" aria-label="Slide precedente" title="Slide precedente"><IconLeft /></button>
          <button onClick={next} disabled={current === total - 1} className="icon-btn" aria-label="Slide successiva" title="Slide successiva"><IconRight /></button>
        </div>
        <div className="group">
          <button onClick={() => setNotesOn(v => !v)} className={notesOn ? 'icon-btn active' : 'icon-btn'} aria-label="Note per chi parla (N)" title="Note per chi parla (N)" aria-pressed={notesOn}><IconNotes /></button>
          {fsOk && <button onClick={toggleFs} className={isFs ? 'icon-btn active' : 'icon-btn'} aria-label="Schermo intero (F)" title="Schermo intero (F)" aria-pressed={isFs}>{isFs ? <IconCollapse /> : <IconExpand />}</button>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
/* @shell-fine */
</script>
</body>
</html>
